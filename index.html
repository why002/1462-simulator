<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1410" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d3b27'/%3E%3Crect x='16' y='18' width='32' height='22' rx='5' fill='%233ddc84'/%3E%3Crect x='20' y='24' width='8' height='7' fill='%23a9d0ea'/%3E%3Crect x='32' y='24' width='8' height='7' fill='%23a9d0ea'/%3E%3Ccircle cx='23' cy='46' r='4' fill='%23ffd24a'/%3E%3Ccircle cx='41' cy='46' r='4' fill='%23ffd24a'/%3E%3C/svg%3E"
    />
    <title>京沪神车 1462 · 基础示例</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud">
        <header class="topbar">
          <div class="brand">
            <span class="badge">V0</span>
            <span class="train-no">1462</span>
            <span class="route">上海 → 北京</span>
          </div>
          <div class="timer"><span id="timer">0:00.0</span></div>
        </header>

        <div class="center-hint" id="start-hint">
          <div class="hint-main">按住加速</div>
          <div class="hint-sub">空格 / ↑ / W / 屏幕 · 松开刹车</div>
          <div class="hint-extra">V0 最小示例 · 4,000 m 直线</div>
        </div>

        <footer class="bottombar">
          <div class="progress">
            <div class="progress-labels">
              <span id="distance">0 / 4,000 m</span>
              <span>终点 4,000 m</span>
            </div>
            <div class="progress-rail"><div id="progress-fill"></div></div>
          </div>
          <div class="dash">
            <div class="speed">
              <div class="speed-value">
                <span id="speed">0</span><span class="speed-unit">km/h</span>
              </div>
              <div class="speed-label">等效时速 · 1463 km 尺度</div>
            </div>
            <div class="dash-note">
              <span class="dot"></span>
              <span>按住加速 · 松开制动</span>
            </div>
          </div>
        </footer>

        <div id="result" class="result hidden" role="dialog" aria-modal="true">
          <div class="result-card">
            <div class="result-kicker">V0 基础示例 · 抵达终点</div>
            <h1>4,000 m 完成</h1>
            <div class="result-time" id="result-time">0:00.0</div>
            <div class="result-row">
              <span>最高等效时速</span><strong id="result-max">0 km/h</strong>
            </div>
            <button id="retry" type="button">再跑一次</button>
            <div class="result-foot">速度表按真实 1463 km 尺度等效显示</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
